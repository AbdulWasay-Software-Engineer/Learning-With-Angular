
<div class="container mt-4">

    <div class="table-card">

        <div class="header">
            <h1>Student Records</h1>
            <p>Student Information Dashboard</p>
        </div>

        <div class="table-responsive">

            <table class="table">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student Name</th>
                        <th>City</th>
                        <th>Status</th>
                        <th>Percentage</th>
                    </tr>
                </thead>

                <tbody>

                    <tr *ngFor="let student of studentList">

                        <td>
                            <span class="id-badge">
                                {{student.id}}
                            </span>
                        </td>

                        <td class="student-name">
                            {{student.name}}
                        </td>

                        <td>
                            <span class="city-badge">
                                {{student.city}}
                            </span>
                        </td>

                        <td [ngStyle]="{
                            'background-color': student.isactive ? '#dcfce7' : '#fee2e2'
                        }">

                            <span class="status active" *ngIf="student.isactive">
                                Active
                            </span>

                            <span class="status inactive" *ngIf="!student.isactive">
                                Inactive
                            </span>

                        </td>

                        <td>
                            <div class="progress-container">

                                <div class="progress-bar"
                                     [ngStyle]="{
                                        'width': student.percentage + '%',
                                        'background-color': student.percentage >= 80 ? '#16a34a' :
                                                            student.percentage >= 50 ? '#f59e0b' : '#dc2626'
            
                                     }">
                                </div>

                            </div>

                            <span class="percentage">
                                {{student.percentage}}%
                            </span>
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <div class="footer">
            Total Students: {{studentList.length}}
        </div>

    </div>

</div>
