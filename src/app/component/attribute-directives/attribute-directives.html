
<div class="container">

    <h3>Attribute Directive</h3>

    <div id="div1" [ngClass]="div1BgColor">
        <h2>Div 1</h2>
        <p>Change My Background Color!</p>
    </div>

    <div class="button-group">

        <button class="btn-blue" (click)="makeBlue()">
            Make Blue
        </button>

        <button class="btn-red" (click)="makeRed()">
            Make Red
        </button>

        <button class="btn-toggle" (click)="toggleColor()">
            Toggle Color
        </button>

    </div>



</div>
